# APIM Community Edition, DB-less: only the gateway runs. API definitions come
# from ConfigMaps written by GKO. No Management API, Console, Portal, MongoDB,
# Elasticsearch or Redis.
api:
  enabled: false
portal:
  enabled: false
ui:
  enabled: false
es:
  enabled: false
mongodb:
  enabled: false
ratelimit:
  type: none

gateway:
  dbLess: true
  replicaCount: 2
  autoscaling:
    enabled: false
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: ""
  image:
    pullPolicy: IfNotPresent
  terminationGracePeriod: 30
  reporters:
    elasticsearch:
      enabled: false

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 768Mi

  deployment:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: gateway
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

  # TLS terminated by the gateway with a cert-manager issued certificate
  # (Secret gateway-tls). keystore.watch reloads it on renewal, no restart.
  ssl:
    enabled: true
    keystore:
      type: pem
      watch: true
      certificates:
        - cert: /etc/gravitee-tls/tls.crt
          key: /etc/gravitee-tls/tls.key
  extraVolumes: |
    - name: gateway-tls
      secret:
        secretName: gateway-tls
  extraVolumeMounts: |
    - name: gateway-tls
      mountPath: /etc/gravitee-tls
      readOnly: true

  # Fixed NodePort, mapped to host 8443 by kind/cluster.yaml.
  service:
    type: NodePort
    externalPort: 443
    nodePort: 30443
    internalPort: 8082

  services:
    sync:
      kubernetes:
        enabled: true
    # Prometheus endpoint on the technical API (port 18082).
    metrics:
      enabled: true
      prometheus:
        enabled: true
    core:
      http:
        enabled: true
        port: 18082
        host: 0.0.0.0
  # The technical API (probes, metrics) uses basic auth. Its password is NOT set here:
  # `make up` generates a random one into Secret gateway-metrics and passes it with --set.
