# Optional: single-node Elasticsearch for the gateway's analytics reporter
# (`make up-analytics`). Password comes from Secret "elasticsearch", created by make.
# Single node, one replica: a local demo. Production uses a proper cluster / service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: gravitee
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: gravitee
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: gravitee
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      serviceAccountName: elasticsearch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
            # Avoids needing vm.max_map_count on the node (no privileged init container).
            - name: node.store.allow_mmap
              value: "false"
            - name: xpack.security.enabled
              value: "true"
            # Plain HTTP: reachable only inside the cluster (see README for the production gap).
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.ml.enabled
              value: "false"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -s -u elastic:$ELASTIC_PASSWORD localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
