kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # Gateway HTTPS: host 8443 -> NodePort 30443 (unprivileged host port, works on macOS and Linux).
      # NodePorts are served on every node, so mapping on the control-plane is enough.
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  # Two workers so replicas and topology spread constraints have something to spread over.
  - role: worker
  - role: worker
